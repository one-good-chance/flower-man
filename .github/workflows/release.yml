nname: Build and release score

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Determine release tag and score name
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scores < <(find score -maxdepth 1 -type f -name '*.mscx' -print)
          if (( ${#scores[@]} != 1 )); then
            echo "Expected exactly one .mscx file directly inside score/; found ${#scores[@]}." >&2
            exit 1
          fi

          score_name=$(basename "${scores[0]}" .mscx)
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "score_name=$score_name"
          } >> "$GITHUB_OUTPUT"

      - name: Package MSCZ
        shell: bash
        env:
          SCORE_NAME: ${{ steps.metadata.outputs.score_name }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"

          (
            cd score
            zip -qr "$release_dir/$SCORE_NAME.mscz" .
          )

          test -s "$release_dir/$SCORE_NAME.mscz"

      - name: Download MuseScore Studio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          musescore_dir="$RUNNER_TEMP/musescore"
          mkdir -p "$musescore_dir"

          gh release download \
            --repo musescore/MuseScore \
            --pattern '*x86_64.AppImage' \
            --dir "$musescore_dir"

          mapfile -t appimages < <(find "$musescore_dir" -maxdepth 1 -type f -name '*.AppImage' -print)
          if (( ${#appimages[@]} != 1 )); then
            echo "Expected exactly one MuseScore AppImage; found ${#appimages[@]}." >&2
            exit 1
          fi

          chmod +x "${appimages[0]}"
          (
            cd "$musescore_dir"
            "${appimages[0]}" --appimage-extract >/dev/null
          )

      - name: Install MuseScore runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libjack-jackd2-0 \
            libnss3 \
            libopengl0 \
            libpipewire-0.3-0 \
            libxcb-cursor0 \
            xauth \
            xvfb

      - name: Export conductor PDF
        shell: bash
        env:
          SCORE_NAME: ${{ steps.metadata.outputs.score_name }}
        run: |
          set -euo pipefail
          musescore="$RUNNER_TEMP/musescore/squashfs-root/AppRun"
          score="$RUNNER_TEMP/release/$SCORE_NAME.mscz"
          output="$RUNNER_TEMP/release/$SCORE_NAME - Conductor.pdf"

          xvfb-run --auto-servernum "$musescore" --export-to "$output" "$score"
          test -s "$output"

      - name: Export part PDFs
        shell: bash
        env:
          SCORE_NAME: ${{ steps.metadata.outputs.score_name }}
        run: |
          set -euo pipefail

          musescore="$RUNNER_TEMP/musescore/squashfs-root/AppRun"
          score="$RUNNER_TEMP/release/$SCORE_NAME.mscz"
          raw_json="$RUNNER_TEMP/parts.raw"
          parts_json="$RUNNER_TEMP/parts.json"
          parts_stderr="$RUNNER_TEMP/parts.stderr"

          # MuseScore can write diagnostic text to stdout together with the
          # JSON response. Capture the complete output and extract the JSON
          # value before passing it to jq.
          xvfb-run --auto-servernum \
            "$musescore" --score-parts-pdf "$score" >"$raw_json" 2>"$parts_stderr"

          python3 - "$raw_json" "$parts_json" <<'PY'
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          decoder = json.JSONDecoder()

          value = None
          for index, character in enumerate(source):
              if character not in "[{":
                  continue

              try:
                  candidate, _ = decoder.raw_decode(source[index:])
              except json.JSONDecodeError:
                  continue

              value = candidate
              break

          if value is None:
              raise SystemExit("MuseScore did not emit valid JSON")

          # Some MuseScore versions wrap the response object in a
          # single-element array.
          if isinstance(value, list):
              if len(value) != 1:
                  raise SystemExit(
                      f"Unexpected MuseScore response array length: {len(value)}"
                  )
              value = value[0]

          if not isinstance(value, dict):
              raise SystemExit(
                  f"Unexpected MuseScore response type: {type(value).__name__}"
              )

          pathlib.Path(sys.argv[2]).write_text(
              json.dumps(value),
              encoding="utf-8",
          )
          PY

          jq -e '
            (.parts | type == "array") and
            (.partsBin | type == "array") and
            (.parts | length == (.partsBin | length))
          ' "$parts_json" >/dev/null

          part_count=$(jq '.parts | length' "$parts_json")
          echo "Exporting $part_count parts"

          for ((i = 0; i < part_count; i++)); do
            part_name=$(jq -r ".parts[$i]" "$parts_json")
            safe_name=$(printf '%s' "$part_name" | sed 's#[/\\:*?"<>|]#-#g')
            output="$RUNNER_TEMP/release/$SCORE_NAME - $safe_name.pdf"

            jq -er ".partsBin[$i]" "$parts_json" \
              | base64 --decode > "$output"

            test -s "$output"
          done

      - name: Export audio file
        shell: bash
        env:
          SCORE_NAME: ${{ steps.metadata.outputs.score_name }}
        run: |
          set -euo pipefail
          musescore="$RUNNER_TEMP/musescore/squashfs-root/AppRun"
          score="$RUNNER_TEMP/release/$SCORE_NAME.mscz"
          output="$RUNNER_TEMP/release/$SCORE_NAME.mp3"

          xvfb-run --auto-servernum "$musescore" --export-to "$output" "$score"

      - name: List release assets
        shell: bash
        run: ls -lh "$RUNNER_TEMP/release"

      - name: Generate conventional changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          context="$RUNNER_TEMP/changelog-context.json"
          changelog="$RUNNER_TEMP/CHANGELOG.md"
          release_notes="$RUNNER_TEMP/release-notes.md"

          jq -n \
            --arg version "$version" \
            --arg repoUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            '{version: $version, repoUrl: $repoUrl}' > "$context"

          npx --yes \
            --package=conventional-changelog@8.1.3 \
            --package=conventional-changelog-conventionalcommits@10.4.0 \
            conventional-changelog \
              --preset conventionalcommits \
              --release-count 0 \
              --tag-prefix v \
              --context "$context" \
              --stdout > "$changelog"

          awk '
            /^## / {
              release_count++
              if (release_count > 1) exit
            }
            release_count == 1 { print }
          ' "$changelog" > "$release_notes"

          first_heading=$(grep -m1 '^## ' "$release_notes")
          if [[ "$first_heading" != *"$version"* ]]; then
            echo "Generated changelog does not start with release $version." >&2
            exit 1
          fi

          cat "$release_notes"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SCORE_NAME: ${{ steps.metadata.outputs.score_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/"* \
            --title "$SCORE_NAME $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag